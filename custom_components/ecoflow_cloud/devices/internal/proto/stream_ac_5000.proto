syntax = "proto3";

// EcoFlow STREAM AC 5000 (SN prefix "ES22") -- internal/App API payloads.
//
// The MQTT envelope is shared with every other Stream device: reuse
// StreamACSendHeaderMsg from stream_ac.proto. Only msg.pdata differs, and
// unlike the STREAM Microinverter it is not obfuscated.
//
// pdata carries a different message per cmd_id:
//
//   cmd_id  2, cmd_func 32   -> StreamAC5000StatusPack   (SoC + remaining time)
//   cmd_id 39, cmd_func 254  -> StreamAC5000Runtime      (power, meter, BMS/CMS)
//   cmd_id 40, cmd_func 254  -> not yet decoded (blocks 60/61/62)
//   cmd_id 50, cmd_func 32   -> StreamAC5000Pack         (pack totals, serials)
//
// Fields that could not be pinned to an observed quantity are omitted rather
// than guessed; protobuf skips unknown fields, so this is lossless.
//
// Floats are watts. Signed integer powers are sint32 (zigzag): read as uint32
// they look like unsigned half-watts, which is how blocks 38, 44 and 54 were
// first read. Blocks 50 and 54 are lists with one entry per unit of a pack.

// ---------------------------------------------------------------- cmd_id 2 --

// Same layout Stream Ultra / Ultra X use for their nested Champ_cmd21_2 block.
message StreamAC5000BatteryStatus {
    optional uint32 cmsMaxChgSoc = 7;    // max charge %
    optional uint32 soc = 9;             // pack scale, not the app-facing one
    optional uint32 bmsChgRemTime = 12;  // minutes to full; 5939 == "unknown"
    optional uint32 bmsDsgRemTime = 13;  // minutes to empty; 5939 == "unknown"
    optional float f32ShowSoc = 15;      // pack scale
    optional uint32 cmsMinDsgSoc = 21;   // min discharge %
}

message StreamAC5000StatusPack {
    optional StreamAC5000BatteryStatus battery = 1;
}

// --------------------------------------------------------------- cmd_id 39 --

// Block 16 -- the paired EcoFlow P1 meter (SN prefix "ES41"). It has no MQTT
// topic of its own and needs no separate registry entry. Arrives empty when the
// meter link is down.
message StreamAC5000Meter {
    optional string meterSn = 3;
    optional float meterPhaseAPower = 4;  // W, signed
    optional float meterPhaseBPower = 5;  // W, signed
    optional float meterPhaseCPower = 6;  // W, signed
    optional float meterPhaseAVol = 7;    // V
    optional float meterPhaseBVol = 8;    // V
    optional float meterPhaseCVol = 9;    // V
    optional uint32 meterFreq = 15;       // Hz
    optional float meterTotalPower = 16;  // W, signed; equals A+B+C
}

// Block 33 -- configured limits and system state, all floats.
message StreamAC5000SysConfig {
    optional float maxChgPow = 1;             // tapers as the pack fills
    optional float maxDsgPow = 2;
    optional float cmsBattFullEnergy = 5;     // Wh usable
    optional float f32ShowSoc = 6;            // system scale, matches the app
    optional float cmsMaxChgSoc = 7;
    optional float cmsMinDsgSoc = 8;
    optional float feedGridModePowLimit = 9;  // default regulatory limit, not
    optional float feedGridModePowMax = 10;   // the owner's approved ceiling
}

// Block 38.1 -- BMS view. SoC reads ~1% below the CMS value.
message StreamAC5000Bms {
    optional uint32 soc = 1;
    optional uint32 cmsMaxChgSoc = 2;
    optional sint32 power = 3;              // W, signed like block 44
    optional uint32 cmsBattFullEnergy = 5;  // Wh
    optional uint32 bmsDsgRemTime = 7;      // minutes; 5939 == "unknown"
    optional uint32 bmsChgRemTime = 8;      // minutes; 5939 == "unknown"
    optional uint32 minCellVol = 9;         // mV
    optional uint32 maxCellVol = 10;        // mV
    optional string bmsSn = 17;
}

message StreamAC5000BmsPack {
    optional StreamAC5000Bms bms = 1;
}

// Block 44 -- this unit's own battery (the app's SysBatteryInfoReport).
message StreamAC5000Cms {
    optional uint32 soc = 1;
    // sint32 on the wire: zigzag makes -477 W read 953 as uint32, which once
    // looked like an unsigned half-watt figure.
    optional sint32 power = 2;              // W; >0 charging, <0 discharging
    optional uint32 cmsBattFullEnergy = 4;  // Wh
    optional uint32 remainCap = 5;          // Wh left in this unit
    optional uint32 dsgRemainTime = 6;      // minutes
    optional uint32 remainTime = 7;         // minutes for the CURRENT direction
}

// Block 11 -- the whole system's energy flow. Every unit of a pack sends the
// same figures, and the open API publishes them as sysEnergyStreamReport.
message StreamAC5000EnergyStream {
    optional sint32 loadPwr = 1;    // W, house load
    optional sint32 gridPwr = 2;    // W, from the grid (<0 = export)
    optional sint32 pvPwr = 3;      // W
    optional sint32 bpPwr = 4;      // W, batteries (>0 charging)
    optional uint32 bpSoc = 5;      // %, system
    optional sint32 onGridPwr = 6;  // W, inverters to the house
    optional sint32 backupPwr = 7;  // W
}

// Block 27 -- pack membership. Role: 0 election, 1 master, 2 slave.
message StreamAC5000SystemConfig {
    optional uint32 systemGroupId = 1;
    optional uint32 distributedDeviceRole = 2;
    optional uint32 seriesDeviceId = 3;
    optional uint32 systemDevCnt = 4;
}

// Block 30 -- backup reserve, applies to the whole pack.
message StreamAC5000BackupConfig {
    optional bool backupSocOnOff = 1;
    optional uint32 backupSoc = 2;
}

// Block 50 -- the master's energy flow of every unit in the pack, one entry per
// serial (a lone unit lists itself). Only the master sends it.
message StreamAC5000DevicePower {
    optional string sn = 1;
    optional float soc = 2;
    optional float pvSelfPwr = 3;      // W, this unit's solar
    optional float gridPortPower = 4;  // W, this unit's battery: >0 charging,
                                       //    <0 discharging (the app's bp_pwr)
    optional uint32 onGridState = 5;
    optional float invPwr = 6;         // W, inverter
    optional float onGridPwr = 7;      // W, to the house
    optional float backupPwr = 8;      // W, backup socket
    optional float pv1Pwr = 9;
    optional float pv2Pwr = 10;
    optional float pv3Pwr = 11;
    optional float pv4Pwr = 12;
}

message StreamAC5000PowerPack {
    repeated StreamAC5000DevicePower power = 1;
}

// Block 54 -- the master's battery view of every unit, one entry per serial.
message StreamAC5000DeviceStat {
    optional string sn = 1;
    optional uint32 soc = 2;
    optional uint32 heatState = 3;
    optional sint32 bpPower = 4;  // W, same sign as block 50
}

message StreamAC5000StatPack {
    repeated StreamAC5000DeviceStat stat = 1;
}

message StreamAC5000Runtime {
    // Blocks 10, 19, 23 and 25 mirror the properties the app writes, under the
    // same field numbers, so every control reads real state. Fields 1/2 of block
    // 23 are the clock and are left undeclared.
    optional StreamAC5000SetDeviceCfg deviceCfg = 23;
    optional StreamAC5000SetPowerLimits powerLimits = 10;
    optional StreamAC5000SetAcOut acOut = 19;
    optional uint32 workMode = 25;
    optional StreamAC5000Meter meter = 16;
    optional StreamAC5000SysConfig sysConfig = 33;
    optional StreamAC5000BmsPack bmsPack = 38;
    optional StreamAC5000Cms cms = 44;
    optional StreamAC5000PowerPack powerPack = 50;
    optional StreamAC5000StatPack statPack = 54;
    optional StreamAC5000EnergyStream sysEnergyStreamReport = 11;
    optional StreamAC5000SystemConfig systemConfig = 27;
    optional StreamAC5000BackupConfig bpBackupConfig = 30;
}

// --------------------------------------------------------------- cmd_id 50 --

// Flat pack-level message. Shared fields line up with stream_ac.proto's
// StreamACChamp_cmd50_3, but it arrives unwrapped here rather than nested.
message StreamAC5000Pack {
    optional float f32ShowSoc = 25;        // pack scale
    optional string version = 36;
    optional string bmsSn = 39;
    optional float realSoh = 52;           // %
    optional float cycleSoh = 53;          // %
    optional float calendarSoh = 54;       // %
    optional uint32 accuChgCap = 50;       // mAh, lifetime
    optional uint32 accuDsgCap = 51;       // mAh, lifetime
    optional uint32 accuChgEnergy = 79;    // Wh, lifetime
    optional uint32 accuDsgEnergy = 80;    // Wh, lifetime
    optional string inverterSn = 81;
}

// ------------------------------------------------------------ set commands --
//
// Writes go to /app/<user_id>/<sn>/thing/property/set with cmd_func 254 and
// cmd_id 38. pdata carries the property id in field 1, and the value rides in
// the field whose number equals that property id. Success comes back on
// .../set_reply as field 1 = property id, field 2 = 1.

// Property 29. The app always sends both limits together, so the entities do too.
message StreamAC5000SetSocLimits {
    optional uint32 cmsMaxChgSoc = 1;
    optional uint32 cmsMinDsgSoc = 2;
}

// Property 10. Partial writes are accepted.
message StreamAC5000SetPowerLimits {
    optional uint32 feedGridModePowLimit = 1;  // "net power out" W
    optional uint32 chgPowLimit = 2;           // "net power in" W
    optional bool feedToGridLimitOnOff = 3;    // feed-in limit enforced
    optional uint32 outLimitField4 = 4;        // constant 4 alongside field 1
    optional uint32 outLimitMax = 5;           // constant 800 alongside field 1
}

// Property 19 -- AC output on/off.
message StreamAC5000SetAcOut {
    optional uint32 enabled = 1;
}

// Property 23 -- general device settings. Fields 1/2 are the app's clock sync;
// only 5 and 6 are user controls.
message StreamAC5000SetDeviceCfg {
    optional uint32 xboostEnabled = 5;
    optional uint32 upsEnabled = 6;
}

message StreamAC5000SetCommand {
    optional uint32 propertyId = 1;
    optional StreamAC5000SetPowerLimits powerLimits = 10;
    optional StreamAC5000SetAcOut acOut = 19;
    optional StreamAC5000SetDeviceCfg deviceCfg = 23;
    optional uint32 workMode = 25;  // 0 self-powered, 1 intelligent, 2 scheduled
    optional StreamAC5000SetSocLimits socLimits = 29;
    optional StreamAC5000BackupConfig bpBackupConfig = 30;
}

// Envelope for outgoing commands. Declared here rather than reusing
// StreamACHeader, which lacks the serial repeats in fields 26 and 27.
message StreamAC5000SetHeader {
    optional bytes pdata = 1;
    optional int32 src = 2;
    optional int32 dest = 3;
    optional int32 d_src = 4;
    optional int32 d_dest = 5;
    optional int32 check_type = 7;
    optional int32 cmd_func = 8;
    optional int32 cmd_id = 9;
    optional int32 data_len = 10;
    optional int32 need_ack = 11;
    optional int32 seq = 14;
    optional int32 version = 16;
    optional int32 payload_ver = 17;
    // Trailing underscore because "from" is a Python keyword; powerstream.proto
    // does the same. Only the field number reaches the wire.
    optional string from_ = 23;
    optional string device_sn = 25;
    optional string device_sn_2 = 26;
    optional string device_sn_3 = 27;
}

message StreamAC5000SendCommandMsg {
    optional StreamAC5000SetHeader msg = 1;
}
